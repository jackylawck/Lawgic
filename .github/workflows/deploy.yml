name: Deploy LogiCore to GitHub Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # 新提交時立即取消舊排隊任務，避免資源浪費

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🌟 1. Rust Toolchain & 增量編譯快取
      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache (Crates & Target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core-engine -> target"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      # 🌟 2. 極限效能 WASM 構建與清理
      - name: Build & Optimize WASM Core
        run: |
          mkdir -p web-frontend/src/wasm
          cd core-engine
          wasm-pack build --target web --release --out-dir ../web-frontend/src/wasm
          rm -f ../web-frontend/src/wasm/.gitignore

      # 🌟 3. 升級 Node.js 24（消除 deprecation 警告，移除不存在 lockfile 時的致命報錯）
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # 🌟 4. 前端依賴自適應安裝（有 lockfile 走確定性 npm ci，無則自動容錯 fallback 至 npm install）
      - name: Install & Verify Frontend Dependencies
        working-directory: web-frontend
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json -> running npm ci"
            npm ci --prefer-offline
          else
            echo "No package-lock.json -> falling back to npm install"
            npm install
          fi
          npm audit --audit-level=high || true

      - name: Build Frontend Artifacts
        working-directory: web-frontend
        env:
          NODE_ENV: production
        run: npm run build

      # 🌟 5. GitHub Pages 部署
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web-frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
