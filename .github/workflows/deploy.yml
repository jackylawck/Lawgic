name: Deploy LogiCore to GitHub Pages

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 🌟 1. Rust Toolchain & 增量快取
      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache (Crates & Target)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "core-engine -> target"

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'latest'

      # 🌟 2. 確定性 WASM 核心構建（移除違法參數 --no-wasm-opt，依賴 Cargo.toml 自動生效）
      - name: Build & Optimize WASM Core
        run: |
          mkdir -p web-frontend/src/wasm
          cd core-engine
          wasm-pack build --target web --release --out-dir ../web-frontend/src/wasm
          rm -f ../web-frontend/src/wasm/.gitignore

      # 🌟 3. 配置 Node.js 與 npm 快取
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'web-frontend/package-lock.json'

      # 🌟 4. 前端依賴自適應安裝
      - name: Install & Verify Frontend Dependencies
        working-directory: web-frontend
        run: |
          if [ -f "package-lock.json" ]; then
            echo "Found package-lock.json -> running npm ci"
            npm ci --prefer-offline
          else
            echo "No package-lock.json -> falling back to npm install"
            npm install
          fi

      # 🌟 5. 前端構建與 SPA 靜態路由相容性處理
      - name: Build Frontend Artifacts
        working-directory: web-frontend
        env:
          NODE_ENV: production
        run: |
          npm run build
          # 禁用 GitHub Pages Jekyll 引擎（避免底線檔案被略過）
          touch dist/.nojekyll
          # 建立 404.html 支援 SPA 深層連結刷新
          cp dist/index.html dist/404.html

      # 🌟 6. GitHub Pages 官方無縫部署
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web-frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
