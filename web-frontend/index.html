    "url": "https://jackylawck.github.io/Lawgic/",
    "applicationCategory": "GameApplication",

  <!-- 首屏平滑樣式與極簡骨架動畫 -->
  <style>
    html, body {
      background-color: #070a0f;
    }
    #initial-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      color: #818cf8;
      user-select: none;
    }
    .initial-spinner {
      width: 28px;
      height: 28px;
      border: 2px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-[#070a0f] text-slate-200 overflow-x-hidden select-none touch-manipulation overscroll-none min-h-screen antialiased">
  <noscript>
    <div style="display: flex; height: 100vh; align-items: center; justify-content: center; text-align: center; padding: 20px; color: #fff; background-color: #070a0f;">
      <h2>運行 Lawgic 羅輯競技平台需要啟用 JavaScript 與 WebAssembly 支援。</h2>
    </div>
  </noscript>

  <!-- ♿ P0-1 補齊：全域無障礙色弱/色盲矩陣濾鏡池 (零空間開銷，跨瀏覽器 100% 穩定) -->
  <svg style="position: absolute; width: 0; height: 0; overflow: hidden;" aria-hidden="true" focusable="false">
    <defs>
      <filter id="cb-protanopia">
        <feColorMatrix type="matrix" values="0.567,0.433,0,0,0 0.558,0.442,0,0,0 0,0.242,0.758,0,0 0,0,0,1,0"/>
      </filter>
      <filter id="cb-deuteranopia">
        <feColorMatrix type="matrix" values="0.625,0.375,0,0,0 0.7,0.3,0,0,0 0,0.3,0.7,0,0 0,0,0,1,0"/>
      </filter>
      <filter id="cb-tritanopia">
        <feColorMatrix type="matrix" values="0.95,0.05,0,0,0 0,0.433,0.567,0,0 0,0.475,0.525,0,0 0,0,0,1,0"/>
      </filter>
      <filter id="cb-achromatopsia">
        <feColorMatrix type="matrix" values="0.299,0.587,0.114,0,0 0.299,0.587,0.114,0,0 0.299,0.587,0.114,0,0 0,0,0,1,0"/>
      </filter>
    </defs>
  </svg>

  <!-- React 根掛載節點 -->
  <div id="root">
    <div id="initial-loader">
      <div class="initial-spinner"></div>
      <div style="font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase;">
        Lawgic Engine Initializing...
      </div>
    </div>
  </div>

  <!-- P0-2 規範修復：相對路徑入口腳本 -->
  <script type="module" src="./src/main.tsx"></script>
