<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="UTF-8" />
    <!-- 啟用 iOS/Android 沉浸式手機全螢幕設定 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LogiCore" />
    <meta name="theme-color" content="#090d14" />

    <!-- 企業級安全防護標頭 (防點擊劫持 Clickjacking、限制指令碼來源) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />

    <!-- 連結 Web App Manifest -->
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="LogiCore192icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="LogiCore192icon.png" />

    <title>LogiCore | Cognitive Arena</title>
  </head>
  <body class="bg-[#090d14] text-slate-200 overflow-x-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- 註冊 Service Worker -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
