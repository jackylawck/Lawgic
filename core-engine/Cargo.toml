[package]
name = "sudoku_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Logicore Engineering Team"]
description = "World-class zero-copy deterministic Sudoku propagation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.92"

# 🌟 引入純前端無鎖輕量隨機發生器（比標準庫更輕、更可重現、零系統調用）
rand_core = "0.6.4"

[profile.release]
# 🌟 極限效能優化等級
opt-level = 3
# 🌟 跨 Crate 全局胖連結優化 (Fat LTO)，徹底內聯 81 格 Peer Table
lto = "fat"
# 🌟 單代碼生成單元，最大化暫存器排程與死碼消除
codegen-units = 1
# 🌟 中止異常展開，縮小 WASM 體積並消除分支跳轉損耗
panic = "abort"
# 🌟 完全剝離符號與除錯資訊
strip = "symbols"
# 🌟 開啟溢位檢查以內聯算術運算，release 模式下消除邊界檢查
overflow-checks = false

[package.metadata.wasm-pack.profile.release]
# 🌟 關閉外掛 wasm-opt，杜絕 CI 環境 validator feature 衝突
wasm-opt = false
