[package]
name = "sudoku_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Logicore Engineering Team"]
description = "World-class zero-copy deterministic Sudoku propagation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 鎖定成熟穩定的 wasm-bindgen 綁定庫
wasm-bindgen = "0.2.92"

[profile.release]
# 🌟 極限速度優化 (針對數獨 CSP 位元回溯徹底內聯)
opt-level = 3
# 🌟 肥大跨 Crate 全局連結時優化 (LTO)
lto = "fat"
# 🌟 單代碼生成單元，最大化全域暫存器排程與死碼消除
codegen-units = 1
# 🌟 移除 unwinding 展開機制，體積驟降且杜絕異常跳轉分支預測損耗
panic = "abort"
# 🌟 徹底剝離所有除錯符號
strip = "symbols"

[package.metadata.wasm-pack.profile.release]
# 🌟 根治 CI 跨環境 wasm-validator 衝突的最穩解法：
# 由 rustc 自身的 opt-level=3 與 lto="fat" 全權接管二進制優化，
# 禁用外掛 wasm-opt，秒級建置且杜絕 feature 不匹配錯誤。
wasm-opt = false
