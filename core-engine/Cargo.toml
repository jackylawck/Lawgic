[package]
name = "sudoku_wasm"
version = "0.1.0"
edition = "2021"
authors = ["Logicore Engineering Team"]
description = "World-class zero-copy deterministic Sudoku propagation engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 鎖定成熟穩定的 wasm-bindgen 綁定庫
wasm-bindgen = "0.2.92"

[profile.release]
# 🌟 極限速度優化 (針對數獨 CSP 位元回溯徹底內聯)
opt-level = 3
# 🌟 肥大跨 Crate 全局連結時優化 (Fat LTO)
lto = "fat"
# 🌟 單代碼生成單元，最大化全域暫存器排程與死碼消除
codegen-units = 1
# 🌟 移除 unwinding 展開機制，體積驟降且消除分支預測損耗
panic = "abort"
# 🌟 徹底剝離所有除錯符號
strip = "symbols"
# 🌟 關閉 release 模式下的溢位安全檢查以完全消除邊界開銷
overflow-checks = false

[package.metadata.wasm-pack.profile.release]
# 🌟 核心：由 rustc 自身全權接管優化，完全關閉外掛 wasm-opt，杜絕 validator 錯誤
wasm-opt = false
